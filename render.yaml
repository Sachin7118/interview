services:
  # 1. Backend Web Service
  - type: web
    name: interviewiq-server
    runtime: node
    plan: free
    rootDir: 3.interviewIQ/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8000
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  # 2. Frontend Static Site
  - type: web
    name: interviewiq-client
    runtime: static
    rootDir: 3.interviewIQ/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_APIKEY
        value: AIzaSyDybcTuPbvsTG5J_h6dL127NlkmaVIHf20
      - key: VITE_RAZORPAY_KEY_ID
        value: rzp_test_TQ1FoynyH0WiC0
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: interviewiq-server
          property: host
